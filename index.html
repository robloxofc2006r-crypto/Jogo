<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pac-Quest</title>
<style>
:root{color-scheme:dark;--bg:#05060f;--fg:#f4f1e6;--ac:#ffd400}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{display:flex;flex-direction:column;height:100%;position:relative}
#hud{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;font-size:14px;font-weight:700;letter-spacing:.04em}
#hud b{color:var(--ac)}
#hud button{padding:4px 10px;font-size:14px}
#cw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,4,12,.72);z-index:5;text-align:center;padding:16px}
#ov.h{display:none}
.pn{max-width:420px}
h1{font-size:clamp(34px,9vw,60px);margin:0 0 6px;color:var(--ac);text-shadow:0 0 18px #ff9d00}
h2{margin:0 0 10px;color:var(--ac)}
p{line-height:1.5;margin:6px 0}
button{font:inherit;font-weight:700;color:#10131f;background:var(--ac);border:0;border-radius:24px;padding:12px 26px;margin:6px;cursor:pointer;box-shadow:0 3px 0 #b38f00}
button:active{transform:translateY(2px);box-shadow:none}
button.s{background:#2a3157;color:var(--fg);box-shadow:0 3px 0 #151a33}
#dp{display:none;margin:4px auto 8px;grid-template:repeat(3,66px)/repeat(3,66px);gap:6px}
@media (pointer:coarse){#dp{display:grid}}
#dp button{margin:0;padding:0;font-size:32px;border-radius:14px;opacity:.8;background:#2a3157;color:#fff;box-shadow:none;touch-action:none}
input{font:inherit;display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px 14px;border-radius:12px;border:2px solid #2a3157;background:#0b0f26;color:var(--fg)}
input[type=range],input[type=color]{display:inline-block;width:auto;padding:0;vertical-align:middle}
.pn.w{max-width:560px;width:100%;max-height:92%;overflow:auto}
#mp{display:none;position:absolute;top:44px;right:8px;z-index:4;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:10px;pointer-events:none;text-align:left}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.sc{background:#12163a;border-radius:14px;padding:10px;font-size:13px}
.sw{width:34px;height:34px;border-radius:50%;margin:0 auto 6px}
td{padding:3px 8px}
#bb{display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(58%,300px);height:12px;background:#1a0a2e;border:2px solid #a000ff;border-radius:8px;z-index:3;pointer-events:none;box-shadow:0 0 12px #7a00ff}
#bb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2d2d,#ff9d00);border-radius:5px;transition:width .3s}
</style></head><body>

   const head=`<h2>PERSONALIZAR</h2><canvas id=pv width=140 height=140 style="width:140px;height:140px;margin:0 auto"></canvas><p>Os teus pontos: <b style="color:#ffd400">${U.points}</b></p><div>${tb('skins','SKINS')}${tb('acc','ACESSÓRIOS')}</div><p id=xm style="color:#ff8a8a;min-height:1.2em"></p>`;

   const accs=`<div class=sc><div class=sw style="background:#2a3157"></div><b>Nenhum</b><br><br><button style="padding:6px 12px;margin:4px" ${!U.acc?'class=s':''} data-a="x_eqa:none">${!U.acc?'SEM ACESSÓRIO':'REMOVER'}</button></div>`+

  set:()=>P(`<h2>DEFINIÇÕES</h2>${U?`<p>👤 <b>${nm(U.username,U.verified)}</b><br>${U.points} pontos · melhor jogo ${U.best}</p><button class=s data-a=x_out>TERMINAR SESSÃO</button>`:'<button class=s data-a=x_login_p>ENTRAR / CRIAR CONTA</button>'}<hr style="border-color:#2a3157"><button class=s data-a=tm>Música: ${mus?'LIGADA':'DESLIGADA'}</button><br><button class=s data-a=ts>Efeitos: ${sfx?'LIGADOS':'DESLIGADOS'}</button><p>Volume <input type=range min=0 max=100 value=${vol} oninput="X.vol(this.value)"></p><button class=s data-a=x_dp>Botões de direção</button><br><button class=s data-a=rb>Apagar recorde local</button><br><button data-a=menu>VOLTAR</button>`)},

 act(a){if(!a.startsWith('x_'))return 0;run(a);return 1},
 tick(dt){
  if(U&&state=='play'&&sk(U.skin).fx&&Math.random()<dt*20){const[x,y]=pos(pac);parts.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,l:.45,c:sk(U.skin).g,s:.08})}

  if(sub&&n-lastS>150){lastS=n;const live=state=='play'||state=='ready',[x,y]=live?pos(pac):[null,null];
   room.send({type:'broadcast',event:'s',payload:{u:U.username,v:U.verified,s:score,l:lives,x,y,sk:U.skin,cc:U.custom_color,ac:U.acc||null,pl:state=='play'?1:0,f:state=='over'||state=='win'?1:0}})}

function renderMp(){if(!room||!U)return;const n=Date.now();
 const a=[{u:U.username,v:U.verified,s:score,l:lives,me:1},...Object.values(pl).filter(p=>n-p.t<3000)].sort((x,y)=>y.s-x.s);

 room=sb.channel('pq-'+c,{config:{broadcast:{self:false}}});
 room.on('broadcast',{event:'s'},({payload:p})=>{p.t=Date.now();pl[p.u]=p})
 .on('broadcast',{event:'go'},({payload:p})=>{diff=p.d;loadBest();start()})

async function run(a){au();
 if(!sb){show('login');msg('Supabase indisponível (sem ligação?)');return}
 if(a=='x_login_p'){ban=0;show('login')}
 else if(a=='x_login'||a=='x_reg'){
  const u=val('lu').trim(),p=val('lp');

  else r=await sb.auth.signInWithPassword({email:em(u),password:p});

 else if(a=='x_rank')show('rank');

 else if(a.startsWith('x_buy:')){const{error}=await sb.rpc('buy_skin',{k:a.slice(6)});await refresh();show('shop');if(error)msg('Não foi possível comprar: '+error.message)}
 else if(a.startsWith('x_eq:')){const c=q('#cc');const{error}=await sb.rpc('equip',{k:a.slice(5),c:c?c.value:null});await refresh();show('shop');if(error)msg(error.message)}
 else if(a=='x_dp'){const d=q('#dp');d.style.display=getComputedStyle(d).display=='none'?'grid':'none'}

 else if(a=='x_run'){

  logs.unshift('> '+esc(t)+' → '+esc(out));logs=logs.slice(0,40);const l=q('#al');if(l)l.innerHTML=logs.join('<br>')}}
})();

const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---------- MAPA ---------- */
function gen(seed,braid){
 const r=rng(seed),m=Array.from({length:GH},()=>Array(GW).fill(1)),st=[[1,1]];m[1][1]=0;
 while(st.length){const[x,y]=st[st.length-1];
  const d=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const nx=x+a,ny=y+b;return nx>0&&ny>0&&nx<GW-1&&ny<GH-1&&m[ny][nx]});
  if(!d.length){st.pop();continue}
  const[a,b]=d[r()*d.length|0];m[y+b/2][x+a/2]=0;m[y+b][x+a]=0;st.push([x+a,y+b])}
 for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++)if(m[y][x]&&(x+y)%2==1&&r()<braid)m[y][x]=0;
 return m}
function bfs(sx,sy){const d=new Int16Array(GW*GH).fill(999),q=[idx(sx,sy)];d[q[0]]=0;
 for(let i=0;i<q.length;i++){const c=q[i],x=c%GW,y=c/GW|0;for(const[a,b]of DIRS){const nx=x+a,ny=y+b;if(open(nx,ny)&&d[idx(nx,ny)]==999){d[idx(nx,ny)]=d[c]+1;q.push(idx(nx,ny))}}}return d}
function snap(x,y){let b=floors[0],bd=1e9;for(const f of floors){const d=(f[0]-x)**2+(f[1]-y)**2;if(d<bd){bd=d;b=f}}return b}

function setup(){

 dots=map.map(r=>r.map(c=>c?0:1));dots[19][9]=0;dots[9][9]=0;
 CORN.forEach(([x,y])=>dots[y][x]=2);

 const rr=rng(L.seed+99);
 if(lvl==2)for(let i=0;i<9;i++){const[x,y]=floors[rr()*floors.length|0];ice[y][x]=1;DIRS.forEach(([a,b])=>{if(open(x+a,y+b))ice[y+b][x+a]=1})}
 if(lvl==3){const c=floors.filter(([x,y])=>DIRS.filter(([a,b])=>open(x+a,y+b)).length==2&&Math.abs(x-9)+Math.abs(y-19)>6&&Math.abs(x-9)+Math.abs(y-9)>3&&dots[y][x]==1);
  for(let i=0;i<7&&c.length;i++){const[x,y]=c.splice(rr()*c.length|0,1)[0];dots[y][x]=0;lava.push({x,y,o:rr()*4})}}
 const ng=DIFF[diff].g[lvl],sel=GT.slice(0,ng);if(ng>=4){if(lvl==3)sel[3]=GT[4];if(lvl==4)sel[3]=GT[5]}
 if(sel.some(s=>s.t=='v'))portals=[[5,5],[13,5],[5,15],[13,15]];
 total=0;got=0;dots.forEach(r=>r.forEach(c=>{if(c)total++}));
 ghosts=sel.map((t,i)=>({...t,i,wait:1.2+i*1.8,pc:i}));
 boss=lvl==5?{x:9,y:3,hp:DIFF[diff].bh,max:DIFF[diff].bh,vul:0,stun:1.2,atk:3}:null;slams=[];bossT=0;

function resetPos(){

const ent=(x,y)=>({tx:x,ty:y,nx:x,ny:y,p:0,dx:0,dy:0});

  if(d){e.dx=d[0];e.dy=d[1];e.nx=e.tx+d[0];e.ny=e.ty+d[1]}else{e.p=0;e.nx=e.tx;e.ny=e.ty;break}}}
const ppick=e=>{const w=pac.want;if(open(e.tx+w[0],e.ty+w[1]))return w;if(open(e.tx+e.dx,e.ty+e.dy))return[e.dx,e.dy];return null};

/* ---------- IA DOS FANTASMAS ---------- */
let dp=new Int16Array(GW*GH);
const pacT=()=>{const[x,y]=pos(pac);return[Math.round(x),Math.round(y)]};
function target(gh){
 if(gh.dead)return HOME;
 const P=pacT();
 if(mode=='chase'){
  if(gh.t=='b'){const a=[P[0]+pac.dx*2,P[1]+pac.dy*2],r=ghosts[0];return snap(2*a[0]-r.tx,2*a[1]-r.ty)}
  if(gh.t=='p')return snap(P[0]+pac.dx*4,P[1]+pac.dy*4);
  if(gh.t=='o'&&dp[idx(gh.tx,gh.ty)]>7)return CORN[gh.pc%4];
  return P}
 if(!gh.rt||(gh.tx==gh.rt[0]&&gh.ty==gh.rt[1])||gh.rtt<=0){
  gh.rt=gh.t=='o'?CORN[++gh.pc%4]:floors[R()*floors.length|0];gh.rtt=8}

function gpick(gh){

 if(gh.flip||!c.length){c=o;gh.flip=0}
 if(c.length<2)return c[0]||null;
 let sc;
 if(!gh.dead&&fright>0&&!gh.imm)sc=d=>-dp[idx(gh.tx+d[0],gh.ty+d[1])];
 else{const t=target(gh),ds=bfs(t[0],t[1]);sc=d=>ds[idx(gh.tx+d[0],gh.ty+d[1])]}
 let best=null,bs=1e9;
 for(const d of c){const s=sc(d)+R()*.5;if(s<bs){bs=s;best=d}}

/* ---------- ATUALIZAÇÃO ---------- */
function update(dt){
 T+=dt;

 if(state=='clear'){ct-=dt;if(ct<=0){lvl++;if(lvl>=6){state='win';saveBest();X.end();jingle([72,72,79,76,79,84,83,88,91,96],.14,'square');show('win')}else{setup();state='ready';rt=2.2}}return}
 if(state!='play')return;
 const P=pacT();dp=bfs(P[0],P[1]);
 // Pac-Man
 const onIce=ice[pac.ty][pac.tx];
 if((pac.nx!=pac.tx||pac.ny!=pac.ty)&&pac.want[0]==-pac.dx&&pac.want[1]==-pac.dy&&(pac.dx||pac.dy)&&!onIce){
  [pac.tx,pac.nx]=[pac.nx,pac.tx];[pac.ty,pac.ny]=[pac.ny,pac.ty];pac.p=1-pac.p;pac.dx*=-1;pac.dy*=-1}
 adv(pac,5.6*(onIce?1.25:1),dt,ppick);
 const[px,py]=pos(pac),rx=Math.round(px),ry=Math.round(py);
 if(dots[ry][rx]){const pw=dots[ry][rx]==2;dots[ry][rx]=0;got++;score+=pw?50:10;sfxp(pw?'pw':'coin');
  for(let i=0;i<(pw?14:6);i++)parts.push({x:rx+.5,y:ry+.5,vx:(R()-.5)*4,vy:(R()-.5)*4,l:.5,c:'#ffd23a',s:.07});
  if(pw){fright=Math.max(3,8-lvl*1.1);chain=0;ghosts.forEach(gh=>{gh.flip=1});if(boss)boss.vul=7}
  if(boss&&got>=total)refill();hud();if(got>=total&&!boss){state='clear';ct=2.8;musOn=false;score+=500*(lvl+1);saveBest();hud();jingle([72,76,79,84,79,84,88],.13,'square');return}}
 // lava
 if(lava.some(l=>l.x==rx&&l.y==ry&&lavaOn(l)))return die();

 const rng2=7+lvl;
 if(mode=='roam'){cool-=dt;if(cool<=0&&ghosts.some(gh=>!gh.dead&&gh.wait<=0&&dp[idx(gh.tx,gh.ty)]<=rng2)){mode='chase';mt=5;ghosts.forEach(gh=>gh.flip=1)}}
 else if(mode=='chase'){mt-=dt;if(mt<=0){mode='scatter';mt=5+R()*2;ghosts.forEach(gh=>{gh.flip=1;gh.rt=floors[R()*floors.length|0];gh.rtt=8})}}
 else{mt-=dt;if(mt<=0){mode='roam';cool=3}}
 if(fright>0){fright-=dt;if(fright<=0)ghosts.forEach(gh=>gh.imm=0)}
 const base=lvl==1?3.6:3.9+.28*lvl;
 for(const gh of ghosts){
  gh.rtt-=dt;
  if(gh.wait>0){gh.wait-=dt;continue}
  if(gh.t=='g'){gh.bt-=dt;if(gh.bt<=0){gh.boost=!gh.boost;gh.bt=gh.boost?1.5:5}}
  if(gh.t=='v'){gh.tc-=dt;if(gh.tc<=0&&mode=='chase'&&fright<=0){
   let bp=null,bd=dp[idx(gh.tx,gh.ty)]-5;for(const p of portals)if(dp[idx(p[0],p[1])]<bd){bd=dp[idx(p[0],p[1])];bp=p}
   if(bp){burst(gh.tx+.5,gh.ty+.5,gh.c);Object.assign(gh,ent(bp[0],bp[1]),{flip:1});burst(bp[0]+.5,bp[1]+.5,gh.c);gh.tc=8;tone(300,.3,'sine',.1,3)}}}
  const fr=fright>0&&!gh.imm&&!gh.dead;
  adv(gh,base*(gh.dead?2.4:fr?.55:1)*(gh.boost?1.45:1),dt,gpick);
  if(gh.dead&&gh.tx==HOME[0]&&gh.ty==HOME[1]){gh.dead=0;gh.imm=1}
  const[gx,gy]=pos(gh);
  if(!gh.dead&&Math.hypot(gx-px,gy-py)<.6){
   if(fr){gh.dead=1;chain++;score+=100*2**chain;sfxp('eat');burst(gx+.5,gy+.5,'#fff');hud()}else return die()}}
}
const lavaOn=l=>(T+l.o)%4<1.6;

function refill(){got=0;total=0;const P=pacT();
 for(const[x,y]of floors){const v=(x==P[0]&&y==P[1])||(x==9&&y==9)?0:1;dots[y][x]=v;if(v)total++}

 else if(id=='laco'){add(mk(G.cone,0xff4fa3,0xff2d9b,.5),0,.52,.17,.12,.22,.12).rotation.x=-PI/2;add(mk(G.cone,0xff4fa3,0xff2d9b,.5),0,.52,-.17,.12,.22,.12).rotation.x=PI/2;add(mk(G.sph,0xff2d9b),0,.52,0,.07,.07,.07)}
 else if(id=='bigode'){add(mk(G.sph,0x3b2412),.4,-.06,.1,.05,.035,.1);add(mk(G.sph,0x3b2412),.4,-.06,-.1,.05,.035,.1)}
 else if(id=='chifres'){add(mk(G.cone,0xe02020),0,.48,.22,.07,.28,.07).rotation.x=.5;add(mk(G.cone,0xe02020),0,.48,-.22,.07,.28,.07).rotation.x=-.5}
 else if(id=='halo'){const t=mk(new T3.TorusGeometry(.3,.035,8,28),0xffe066,0xffe066,.9);t.rotation.x=PI/2;add(t,0,.78,0)}
 else if(id=='coroa'){add(mk(G.cyl,0xffd400,0x8a6a00,.4),0,.5,0,.28,.16,.28);for(let i=0;i<5;i++){const an=i*PI*2/5;add(mk(G.cone,0xffd400,0x8a6a00,.4),Math.cos(an)*.26,.66,Math.sin(an)*.26,.06,.2,.06)}add(mk(G.sph,0xff2d55,0xff2d55,.8),.28,.52,0,.05,.05,.05)}
 else if(id=='natal'){add(mk(G.cone,0xd32f2f,0x550000,.3),-.03,.7,0,.3,.55,.3).rotation.z=.35;const t=mk(new T3.TorusGeometry(.3,.06,8,24),0xffffff);t.rotation.x=PI/2;add(t,0,.44,0);add(mk(G.sph,0xffffff,0xffffff,.3),-.13,.98,0,.09,.09,.09)}
 return a}

function build(){if(!o.on||!map)return;init();
 if(grp)sc.remove(grp);mats.forEach(m=>m.dispose());mats=[];plM={};
 grp=new T3.Group();sc.add(grp);
 const th=[{w:0x1b2bd6,e:0x1b2bd6,ei:.5,f:0x05051a},{w:0x2a9a45,e:0x0a3a14,ei:.3,f:0x0d2a18},{w:0xd8f4ff,e:0x7cc6e8,ei:.25,f:0x6fb8dc},
  {w:0x4a2d25,e:0xff4a10,ei:.55,f:0x2a0a05},{w:0xffffff,e:0xb8d4ff,ei:.35,f:0x8fc4f0},{w:0x14002a,e:0x8a00ff,ei:.7,f:0x07000f}][lvl];
 sc.background=new T3.Color(L.b[0]);sc.fog=new T3.Fog(L.b[0],70,160);
 grp.add(mesh(G.plane,M(th.f,0,0,{roughness:.9}),GW/2,0,GH/2,GW,1,GH));
 let n=0;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(map[y][x])n++;
 const wh=lvl==4?.8:1.1,im=new T3.InstancedMesh(G.box,M(th.w,th.e,th.ei),n),m4=new T3.Matrix4(),q0=new T3.Quaternion();let k=0;
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(map[y][x]){m4.compose(new T3.Vector3(x+.5,wh/2,y+.5),q0,new T3.Vector3(.94,wh,.94));im.setMatrixAt(k++,m4)}
 grp.add(im);
 const iceM=new T3.MeshBasicMaterial({color:0xb4ebff,transparent:true,opacity:.5});mats.push(iceM);
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(ice[y][x]&&!map[y][x])grp.add(mesh(G.plane,iceM,x+.5,.02,y+.5,.98,1,.98));
 const cm=M(0xffd23a,0x7a5200,.5,{metalness:.5,roughness:.3}),pw=M(0xffb300,0xff8a00,.9);
 dM=new Array(GW*GH).fill(null);
 for(const[x,y]of floors){const m=mesh(G.coin,cm,x+.5,.45,y+.5);grp.add(m);dM[idx(x,y)]=m}
 pM=CORN.map(([x,y])=>{const m=mesh(G.pow,pw,x+.5,.45,y+.5);grp.add(m);return m});
 lvM=[M(0xff3b00,0xff2200,1),M(0x5a1a00,0,0),M(0xff9a3a,0xff9a3a,.8)];
 lM=lava.map(l=>{const m=mesh(G.box,lvM[1],l.x+.5,.07,l.y+.5,.8,.12,.8);grp.add(m);return m});
 const ptm=M(0xc28bff,0x9a4dff,.9);
 pvM=portals.map(p=>{const m=mesh(new T3.TorusGeometry(.32,.05,8,24),ptm,p[0]+.5,.5,p[1]+.5);m.rotation.x=PI/2;grp.add(m);return m});
 // Pac-Man
 pm=M(0xffd400,0xffb300,.25,{roughness:.35,side:T3.DoubleSide});
 pacG=new T3.Group();jT=new T3.Mesh(G.jt,pm);jB=new T3.Mesh(G.jb,pm);pacG.add(jT,jB);
 const bk=M(0x000000);[.245,-.245].forEach(z=>pacG.add(mesh(G.sph,bk,.17,.29,z,.06)));
 accG=new T3.Group();pacG.add(accG);accK=null;grp.add(pacG);
 // fantasmas
 const wm=M(0xffffff),pk=M(0x111122);
 gM=ghosts.map(gh=>{const gm=M(gh.c,0,0),gg=new T3.Group(),body=mesh(G.cyl,gm,0,.225,0,.38,.35,.38),head=mesh(G.sph,gm,0,.4,0,.38);
  gg.add(body,head);[.14,-.14].forEach(z=>{gg.add(mesh(G.sph,wm,.3,.48,z,.1));gg.add(mesh(G.sph,pk,.38,.48,z,.05))});grp.add(gg);return{g:gg,m:gm,body,head}});
 // boss
 bossG=null;slM=[];
 if(boss){bossG=new T3.Group();bossM=M(0x030006,0x2a0050,.5,{roughness:.25,metalness:.7});
  bossG.add(mesh(G.sph,bossM,0,0,0,1.5));
  const sp=M(0x000000,0x5a00a0,.6);
  for(let i=0;i<12;i++){const a=i*PI/6,h=new T3.Group(),c=mesh(G.cone,sp,1.75,0,0,.22,.8,.22);c.rotation.z=-PI/2;h.add(c);h.rotation.y=-a;bossG.add(h)}
  const em=M(0xff1a1a,0xff0000,1.5);bossE=em;
  [-1,1].forEach(sd=>{const e=mesh(G.box,em,sd*.6,.35,1.32,.34,.16,.12);e.rotation.z=-sd*.4;bossG.add(e)});
  const tm=M(0xe9d5ff,0x6a4aa0,.4);
  for(let t=-2;t<=2;t++){const x=t*.3;bossG.add(mesh(G.box,tm,x,-.45,Math.sqrt(2.25-.25-x*x),.14,.28,.12))}
  ring=new T3.Mesh(new T3.TorusGeometry(2.2,.05,8,48),M(0xa000ff,0xa000ff,1));ring.rotation.x=PI/2;bossG.add(ring);
  bossG.add(new T3.PointLight(0xa000ff,1.2,10));grp.add(bossG);
  for(let i=0;i<10;i++){const mt=new T3.MeshBasicMaterial({color:0xff2020,transparent:true,opacity:.5});mats.push(mt);const m=new T3.Mesh(G.box,mt);m.visible=false;grp.add(m);slM.push(m)}}
}

function frame(){
 if(!inited||!pacG||!grp)return;
 const now=performance.now(),dt=Math.min(.1,(now-lt)/1000||0);lt=now;
 const[px,py]=pos(pac);
 pacG.position.set(px+.5,.42,py+.5);
 if(pac.dx||pac.dy){const tg=-Math.atan2(pac.dy,pac.dx);let d=tg-hd;d=Math.atan2(Math.sin(d),Math.cos(d));hd+=d*Math.min(1,dt*16)}
 pacG.rotation.y=hd;
 let m=.04+.26*Math.abs(Math.sin(T*14));if(state=='dying')m=Math.min(.98,(1-dyT/1.6)*1.1);
 jT.rotation.z=m*PI;jB.rotation.z=-m*PI;
 pacG.scale.setScalar(state=='dying'?Math.max(.01,dyT/1.6):1);
 pm.color.set(X.col());pm.emissive.set(X.gl());
 const ak=X.acc()||'';if(ak!==accK){accK=ak;accG.clear();if(ak)accG.add(acc3(ak))}
 pl3.position.set(px+.5,2,py+.5);
 // fantasmas
 ghosts.forEach((gh,i)=>{const e=gM[i];if(!e)return;const[x,y]=pos(gh);
  const fr=fright>0&&!gh.imm&&!gh.dead,bl=fr&&fright<2&&(T*6|0)%2;
  e.g.position.set(x+.5,gh.wait>0?Math.sin(T*5+i)*.05:0,y+.5);
  e.g.rotation.y=(gh.dx||gh.dy)?-Math.atan2(gh.dy,gh.dx):0;
  e.body.visible=e.head.visible=!gh.dead;
  e.m.color.set(fr?(bl?0xffffff:0x2b3cff):gh.c);
  e.m.emissive.set(gh.boost?0xffffff:0x000000);e.m.emissiveIntensity=gh.boost?.5:0});
 // moedas
 for(let i=0;i<dM.length;i++){const d=dM[i];if(!d)continue;const x=i%GW,y=i/GW|0;d.visible=dots[y][x]==1;if(d.visible)d.rotation.y=T*4+(x+y)*.6}
 pM.forEach((p,j)=>{const[x,y]=CORN[j];p.visible=dots[y][x]==2;p.scale.setScalar(1+Math.sin(T*6)*.12)});
 lM.forEach((mm,i)=>{const l=lava[i],on=lavaOn(l),warn=!on&&(T+l.o)%4>3.5;mm.material=on?lvM[0]:warn&&(T*12|0)%2?lvM[2]:lvM[1];mm.position.y=on?.12:.07});
 pvM.forEach(p=>p.rotation.z=T*3);
 // boss
 if(bossG&&boss){const b=boss,vul=b.vul>0,st=b.stun>0&&(T*14|0)%2;
  bossG.position.set(b.x+.5,1.6+Math.sin(T*2)*.15,b.y+.5);bossG.rotation.y=Math.sin(T*.8)*.25;
  bossM.color.set(st?0xffffff:vul?0x0a0a3a:0x030006);bossM.emissive.set(vul?0x2233ff:0x2a0050);
  bossE.color.set(vul?0x9bb0ff:0xff1a1a);bossE.emissive.set(vul?0x4466ff:0xff0000);
  ring.rotation.z+=dt;
  slM.forEach((s,i)=>{const sl=slams[i];if(!sl){s.visible=false;return}const on=sl.t>1.2;
   s.visible=true;s.scale.set(.9,on?1.8:.06,.9);s.position.set(sl.x+.5,on?.9:.04,sl.y+.5);
   s.material.color.set(on?0xff5a00:0xff2020);s.material.opacity=on?.9:.35+.2*Math.sin(T*14)})}
 // outros jogadores
 const nw=Date.now(),me=X.me(),used={};
 if(me&&state=='play'){for(const p of Object.values(X.pls())){if(p.x==null||!p.pl||nw-p.t>1500||p.u==me.username)continue;used[p.u]=1;
  let e=plM[p.u];if(!e){e=mesh(G.sph,M(0xffffff,0,0,{transparent:true,opacity:.7}),0,.42,0,.36);grp.add(e);plM[p.u]=e}
  e.material.color.set(X.cof(p.sk,p.cc));e.position.set(p.x+.5,.42,p.y+.5)}}
 for(const u in plM)if(!used[u]){grp.remove(plM[u]);delete plM[u]}
 // partículas
 let n=0;const pa=pts.geometry.attributes.position,ca=pts.geometry.attributes.color;
 for(const p of parts){if(n>=400)break;pa.setXYZ(n,p.x,.8,p.y);const c=p._c||(p._c=new T3.Color(p.c));ca.setXYZ(n,c.r,c.g,c.b);n++}
 pts.geometry.setDrawRange(0,n);pa.needsUpdate=true;ca.needsUpdate=true;
 // câmara
 const asp=cam.aspect,zm=Math.min(2.2,Math.max(1,1.2/asp)),fx=asp<1?.5:.38;
 const tx=9.5+(px+.5-9.5)*fx,tz=10.5+(py+.5-10.5)*fx,k=Math.min(1,dt*5);
 cx+=(tx-cx)*k;cz+=(tz-cz)*k;
 cam.position.set(cx,17*zm,cz+11.5*zm);cam.lookAt(cx,0,cz+.3);
 ren.render(sc,cam)}

o.resize=()=>{if(!ren)return;const a=document.querySelector('#cw'),w=a.clientWidth,h=a.clientHeight;if(!w||!h)return;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()};
o.build=build;o.frame=frame;
o.enable=()=>{try{init()}catch(e){alert('Não foi possível iniciar o 3D neste dispositivo.');return}
 o.on=true;cv.style.display='none';c3.style.display='block';o.resize();build();btn();try{localStorage.setItem('pq_3d','1')}catch(e){}};
o.disable=()=>{o.on=false;if(c3)c3.style.display='none';cv.style.display='block';btn();fit();try{localStorage.setItem('pq_3d','0')}catch(e){}};
o.toggle=()=>o.on?o.disable():o.enable();
try{if(localStorage.getItem('pq_3d')=='1')o.enable()}catch(e){}
return o})();

</script></body></html>
